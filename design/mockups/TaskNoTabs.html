<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Humanloop — a task with no tabs</title>
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#111113}
.win{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-size:13px;line-height:18px;color:#ededf1;-webkit-font-smoothing:antialiased}
.mono,.k,.pri,.qn,.age{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.win button{font:inherit;color:inherit;cursor:default}
.tl{width:12px;height:12px;border-radius:50%;flex:none}
.ib{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;border-radius:6px;color:#8a8a95;padding:0}
.ib:disabled{color:#44444c}
.btn{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:6px;border:1px solid transparent;background:transparent;color:#a3a3ad;font-size:12.5px;font-weight:500;white-space:nowrap}
.btn.primary{background:rgba(111,210,176,.13);border-color:transparent;color:#6fd2b0;font-weight:600}
.btn.primary .k{background:rgba(111,210,176,.16);color:#6fd2b0}
.acts{display:flex;gap:2px;flex:none;opacity:0;transition:opacity .12s}
.sep{opacity:0;transition:opacity .12s}
.tbar:hover .acts,.tbar:hover .sep{opacity:1}
.k{font-size:10.5px;line-height:16px;padding:0 5px;border-radius:4px;background:#2a2a31;color:#a3a3ad;white-space:nowrap}
.qh{display:flex;align-items:center;gap:8px;height:24px;margin:14px 16px 2px 18px;font-size:12px;line-height:16px;color:#8a8a95;font-weight:600;border:0;background:transparent;width:calc(100% - 34px);padding:0;text-align:left}
.qh::before{content:"";width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid #55555e;flex:none;margin-right:2px}
.qh.col::before{transform:rotate(-90deg)}
.qn{font-size:11px;line-height:16px;font-weight:600;color:#6f6f7a}
.qn.you{color:#6fd2b0}
.row{display:flex;align-items:center;gap:8px;height:36px;width:calc(100% - 16px);margin:0 8px;padding:0 8px 0 10px;border:0;border-radius:6px;background:transparent;text-align:left}
.row.sel{background:#26262b}
.pri{flex:none;width:22px;height:16px;border-radius:4px;background:#34343c;font-size:10px;line-height:16px;font-weight:600;text-align:center;color:#ededf1}
.ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:4px;flex:none}
.d{width:6px;height:6px;border-radius:50%;box-sizing:border-box}
.d.w{background:#5b9cf6}
.d.n{background:#6fd2b0;box-shadow:0 0 0 2px rgba(111,210,176,.22)}
.d.ok{border:1.5px solid #6fd2b0}
.d.sh{border:1px solid #5a5a66}
.age{flex:none;min-width:34px;text-align:right;font-size:11px;line-height:16px;color:#6f6f7a}
.age.you{color:#6fd2b0}
</style>

<div class="win" style="width: 1440px; height: 900px; display: flex; background: #111113; border-radius: 12px; overflow: hidden; position: relative">

  <aside style="width: 288px; flex: none; display: flex; flex-direction: column; background: #17171a; border-right: 1px solid #222227">
    <div style="height: 44px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 13px">
      <span class="tl" style="background: #ff5f57"></span><span class="tl" style="background: #febc2e"></span><span class="tl" style="background: #28c840"></span>
      <span style="flex: 1"></span>
      <button class="ib" aria-label="Back to previous task (⌘[)"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5 4.5 7 9 11.5"/></svg></button>
      <button class="ib" aria-label="Forward (⌘])" disabled><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 2.5 4.5 4.5L5 11.5"/></svg></button>
    </div>

    <nav aria-label="Task queues" style="flex: 1; overflow: hidden; padding-bottom: 12px">
      <button class="qh" style="margin-top: 6px" aria-expanded="true"><span>Your turn</span><span class="qn you">3</span></button>
      <button class="row" title="Fix flaky queue ordering test"><span class="pri">P1</span><span class="ttl">Fix flaky queue ordering test</span><span class="dots"><span class="d n"></span><span class="d sh"></span></span><span class="age you">4m</span></button>
      <button class="row" title="Session restore: resume prompt shows wrong cwd"><span class="ttl">Session restore: resume prompt shows wrong cwd</span><span class="dots"><span class="d ok"></span></span><span class="age you">16m</span></button>
      <button class="row sel" title="Dock badge count ignores parked tasks" aria-current="true"><span class="ttl">Dock badge count ignores parked tasks</span><span class="age you">1h 09m</span></button>

      <button class="qh" aria-expanded="true"><span>Agent's turn</span><span class="qn">4</span></button>
      <button class="row" title="Add a shortcut recorder to Settings"><span class="ttl">Add a shortcut recorder to Settings</span><span class="dots"><span class="d w"></span><span class="d ok"></span><span class="d sh"></span><span class="d sh"></span></span><span class="age">10m</span></button>
      <button class="row" title="Resizable sidebar: persist width across launches"><span class="ttl">Resizable sidebar: persist width across launches</span><span class="dots"><span class="d w"></span></span><span class="age">6m</span></button>
      <button class="row" title="Migrate test runner to vitest 3"><span class="ttl">Migrate test runner to vitest 3</span><span class="dots"><span class="d w"></span></span><span class="age">45m</span></button>
      <button class="row" title="Notifications: deep-link to the task on click"><span class="ttl">Notifications: deep-link to the task on click</span><span class="dots"><span class="d w"></span><span class="d sh"></span></span><span class="age">22m</span></button>

      <button class="qh" aria-expanded="true"><span>Parked</span><span class="qn">2</span></button>
      <button class="row" title="Explore split panes inside a tab"><span class="ttl" style="color: #8a8a95">Explore split panes inside a tab</span><span class="age">2d</span></button>
      <button class="row" title="Light theme pass"><span class="ttl" style="color: #8a8a95">Light theme pass</span><span class="age">5d</span></button>

      <button class="qh col" aria-expanded="false"><span>Done</span><span class="qn">1</span></button>
    </nav>
  </aside>

  <main style="flex: 1; min-width: 0; display: flex; flex-direction: column">
    <div class="tbar" style="height: 44px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 12px 0 20px">
      <h1 title="Dock badge count ignores parked tasks" style="flex: 1; min-width: 0; margin: 0 8px 0 0; font-size: 15px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Dock badge count ignores parked tasks</h1>
      <div class="acts"><button class="ib" aria-label="Edit task (⌘E)" title="Edit task  ⌘E"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.6 2.4l2 2L5 11H3v-2z"/><path d="M8.4 3.6l2 2"/></svg></button><button class="ib" aria-label="Park task (⌘⇧P)" title="Park task  ⌘⇧P"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 2.5v9M9 2.5v9"/></svg></button><button class="ib" aria-label="Mark done (⌘⇧D)" title="Mark done  ⌘⇧D"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 7.5l3 3 6-7"/></svg></button></div>
      <span class="sep" aria-hidden="true" style="width: 1px; height: 16px; background: #2a2a31; margin: 0 6px; flex: none"></span>
      <button class="ib" aria-label="New task (⌘N)"><svg width="15" height="15" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M7 2.5v9M2.5 7h9"/></svg></button>
      <button class="ib" aria-label="Settings (⌘,)" style="margin-right: 6px"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v1.6M8 12.6v1.6M1.8 8h1.6M12.6 8h1.6M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M3.6 12.4l1.1-1.1M11.3 4.7l1.1-1.1"/></svg></button>
      <button class="btn primary" style="max-width: 340px"><span style="opacity: .7; font-weight: 500">Next</span><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis">Fix flaky queue ordering test</span><span class="k">⌘↩</span></button>
    </div>

    <div role="tablist" aria-label="Terminal tabs" style="flex: none; display: flex; align-items: center; height: 36px; padding: 0 20px; border-bottom: 1px solid #222227">
      <button class="ib" aria-label="New tab (⌘T)" style="margin-left: -6px"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M7 2.5v9M2.5 7h9"/></svg></button>
    </div>

    <div style="flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center">
      <div style="display: flex; flex-direction: column; gap: 16px; align-items: center">
        <h2 style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 600; color: #a3a3ad">No tabs</h2>
        <button class="btn primary" style="height: 32px; padding: 0 14px">New tab <span class="k">⌘T</span></button>
      </div>
    </div>
  </main>
</div>

</body>
</html>
